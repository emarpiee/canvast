name: Screenshots

# The README's pictures, taken on GitHub's runners (they drive the whole app, which lags a workstation in use). Run by hand; the pictures come as an artifact to look at and commit.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: Only the pictures whose names match this (a regular expression; empty for all)
        default: ""
      only:
        description: Also these older scripts of scripts/showcase, separated by spaces (empty for none)
        default: ""

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg webp zip imagemagick
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          CANVAST_DEFAULT_LOOK: legacy # (the pictures, as every test, in Legacy)
      - run: npm run build:desktop
      - run: npm run build:tools
      - name: Draw the showcase
        run: xvfb-run -a node scripts/showcase/build.mjs showcase.canvast
      - name: Take the pictures
        # (each picture is a test of tests/shots on its own page: one that fails leaves the others, and its trace)
        env:
          CANVAST_BUILD_DIR: dist
          CANVAST_SHOTS_DIR: shots
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npx playwright test -c playwright.shots.config.ts ${{ inputs.grep && format('-g "{0}"', inputs.grep) || '' }} || echo "SOME PICTURES FAILED"
      - name: Older scripts
        if: inputs.only != ''
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          for s in ${{ inputs.only }}; do
            echo "== $s"
            xvfb-run -a node "scripts/showcase/$s.mjs" showcase.canvast shots/ || echo "FAILED $s"
          done
      - name: WebP
        run: |
          for f in shots/*.png; do w=$(identify -format %w "$f"); if [ "$w" -gt 1280 ]; then cwebp -quiet -q 78 -resize 1280 0 "$f" -o "${f%.png}.webp"; else cwebp -quiet -q 78 "$f" -o "${f%.png}.webp"; fi; done
          # (a picture past about 80 KB is made again at lower quality, then lower still)
          for f in shots/*.png; do o="${f%.png}.webp"; for q in 66 56 46; do [ "$(stat -c %s "$o")" -le 82000 ] && break; w=$(identify -format %w "$f"); r=""; [ "$w" -gt 1280 ] && r="-resize 1280 0"; cwebp -quiet -q $q $r "$f" -o "$o"; done; done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.webp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-shots
          path: shots-results/
          if-no-files-found: ignore
