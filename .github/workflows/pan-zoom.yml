# The pan and zoom standard: panning and wheel zooming the Powers of two showcase (about 7,000 objects) with real input, held to the
# budget in scripts/lib/pan-zoom-budget.mjs. It fails when a change makes the canvas view slower; `npm run release` needs it passed on
# the commit it releases. The numbers are in the log, the CPU profiles in the artifact.
name: Pan and zoom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pan-zoom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Draw the showcase
        run: xvfb-run -a node scripts/showcase/build.mjs showcase.canvast
      - name: Pan and zoom, held to the standard
        run: xvfb-run -a node scripts/bench-pan.mjs showcase.canvast pan-zoom --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pan-zoom
          path: pan-zoom/
