name: CI

# The fast checks on every push to main and every pull request. The end-to-end suite runs in tests.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:offline
      - run: npm run check:names
      - run: npm run check:tokens
      - run: npm run check:storage
      - run: npm run check:picker
      - run: npm run check:patterns
      - run: npm run check:repro
      - name: Keep the built file
        uses: actions/upload-artifact@v4
        with:
          name: canvast.html
          path: dist/canvast.html
          retention-days: 14

