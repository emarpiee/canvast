# Panning a drawing of many long strokes with real input (scripts/bench-pan.mjs): frames per second, frame and draw times, tiles built, and
# a CPU profile of where the time goes. Run by hand (Run workflow); the numbers land in the run's log and the profiles in its artifact.
name: Bench pan

on:
  workflow_dispatch:
    inputs:
      strokes:
        description: How many hatching strokes (when the scene is hatch)
        default: "900"
      scene:
        description: "hatch: generated strokes; showcase: the Powers of two showcase at a bookmark"
        type: choice
        options: [hatch, showcase]
        default: hatch
      bookmark:
        description: The showcase's bookmark to bench at
        default: "1 · The Solar System"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Draw the showcase
        if: inputs.scene == 'showcase'
        run: xvfb-run -a node scripts/showcase/build.mjs showcase.canvast
      - run: xvfb-run -a node scripts/bench-pan.mjs ${{ inputs.scene == 'showcase' && 'showcase.canvast' || inputs.strokes }} bench-pan
        env:
          BENCH_BOOKMARK: ${{ inputs.bookmark }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-pan
          path: bench-pan/
