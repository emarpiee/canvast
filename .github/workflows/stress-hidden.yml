# Hidden items under load and under crashes (scripts/stress-hidden.mjs), in the desktop app on GitHub's machine: too long for a
# workstation in use. Run by hand (Run workflow); the tables land in the run's summary, and the run fails when an item was lost or damaged.
name: Stress hidden

on:
  workflow_dispatch:
    inputs:
      items:
        description: Hidden items in the scale part
        default: "10000"
      rounds:
        description: Crash rounds (the app killed at a random moment)
        default: "30"
      seed:
        description: Seed (empty for a new one; a failed run's seed runs it again)
        default: ""
      big:
        description: Big files instead of the scale part (0 off; 1 = about 15 GB from 50 KB to 2 GB, beside the small items above)
        default: "0"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
      # (a test snapshot holds the desktop build the run opens)
      - run: xvfb-run -a npm run test:snap -- --project=desktop tests/e2e/desktop.spec.ts -g sandboxed
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      # (big files need the machine's larger disk, at /mnt)
      - run: |
          sudo mkdir -p /mnt/stress && sudo chown "$(id -u)" /mnt/stress
          df -h "$RUNNER_TEMP" /mnt
      - run: set -o pipefail; xvfb-run -a node scripts/stress-hidden.mjs --items ${{ inputs.items }} --rounds ${{ inputs.rounds }} --big ${{ inputs.big }} ${{ inputs.seed && format('--seed {0}', inputs.seed) || '' }} --dir "${{ inputs.big != '0' && '/mnt/stress' || format('{0}/stress', runner.temp) }}" | tee stress.txt
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          STRESS_KEEP: ${{ runner.temp }}/stress-keep
      - if: always()
        run: grep -E '^(\||seed|✅|❌|[0-9]+ of)' stress.txt >> "$GITHUB_STEP_SUMMARY" || true
      # (when items went missing: the folder as it stood, made-up files only)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-keep
          path: ${{ runner.temp }}/stress-keep
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
